<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player card — ScamShield Live</title>
  <meta name="theme-color" content="#0b0d14">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Leaflet: free map library, used only to draw the map on YOUR screen -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
</head>
<!-- Permission trap 2 of 3 (location). Looks like a normal app feature
     on purpose. Coordinates stay in memory on this page only. -->
<body data-step="5" data-trap="location">
  <header id="topbar"></header>

  <main class="page">
    <div class="setup-steps" aria-hidden="true"><span class="done"></span><span class="now"></span><span></span></div>
    <div class="page-head">
      <p class="meta">Player card · 2 of 3</p>
      <h1>Pin your city on the batch map</h1>
      <p class="lead">The batch report shows which areas played. Only your city is used, never your exact spot.</p>
    </div>

    <div id="map-slot" class="map-placeholder" aria-hidden="true"><i data-icon="map-pin"></i></div>
    <div id="map" class="map hidden" role="img" aria-label="Map showing your current position"></div>

    <p id="status" class="center muted" style="margin-top:16px;min-height:24px" aria-live="polite"></p>

    <div id="actions" class="stack next-row">
      <button id="primary-btn" class="btn btn-primary btn-block" type="button"><i data-icon="map-pin"></i> Use my location</button>
      <button id="skip-btn" class="btn btn-quiet btn-block" type="button">Skip for now</button>
    </div>

    <div id="next" class="next-row hidden">
      <a class="btn btn-primary btn-block" href="trap-notify.html">Continue <i data-icon="arrow-right"></i></a>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="js/traps.js"></script>
</body>
</html>
