<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player card — ScamShield Live</title>
  <meta name="theme-color" content="#0b0d14">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<!-- Permission trap 1 of 3 (camera). It is made to look like a normal
     app feature on purpose. The truth is revealed on trap-notify.html.
     The camera is shown on screen only and switched off after 3 s. -->
<body data-step="4" data-trap="camera">
  <header id="topbar"></header>

  <main class="page">
    <div class="setup-steps" aria-hidden="true"><span class="now"></span><span></span><span></span></div>
    <div class="page-head">
      <p class="meta">Player card · 1 of 3</p>
      <h1>Add a photo to your player card</h1>
      <p class="lead">It appears on your score card at the end. The photo stays on this phone.</p>
    </div>

    <div id="player-card"></div>

    <p id="camera-live" class="camera-live hidden" aria-live="assertive"><span class="rec-dot"></span><span id="camera-text">Camera on · hold still</span></p>

    <p id="status" class="center muted" style="margin-top:16px;min-height:24px" aria-live="polite"></p>

    <div id="actions" class="stack next-row">
      <button id="primary-btn" class="btn btn-primary btn-block" type="button"><i data-icon="camera"></i> Take photo</button>
      <button id="skip-btn" class="btn btn-quiet btn-block" type="button">Skip for now</button>
    </div>
  </main>

  <script type="module" src="js/traps.js"></script>
</body>
</html>
