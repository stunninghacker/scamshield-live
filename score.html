<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your score — ScamShield Live</title>
  <meta name="theme-color" content="#0b0d14">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-step="9">
  <header id="topbar"></header>

  <main class="page stack-lg" id="score-page">
    <section>
      <p class="meta" style="margin-bottom:16px">Your score card</p>
      <div class="score-hero">
        <div>
          <div class="score-figure" aria-live="polite"><span id="awareness">0</span><span class="of"> / 100</span></div>
          <p class="muted" style="margin-top:12px">Awareness score</p>
        </div>
        <div class="rank">
          <span id="rank-icon"></span>
          <div class="rank-name" id="rank-name"></div>
          <div class="rank-sub" id="rank-sub"></div>
        </div>
      </div>
      <div class="awareness-bar"><span id="awareness-fill"></span></div>
    </section>

    <section class="card" id="confidence-card"></section>

    <section class="card">
      <h3>Your results</h3>
      <ul class="rows" id="result-list"></ul>
    </section>

    <p class="formula">Awareness = round(correct ÷ 8 × 60) + 10 per permission blocked (max 30) + 10 if you escaped the call</p>

    <div class="stack">
      <a class="btn btn-primary btn-block" href="report.html">See how your batch did <i data-icon="arrow-right"></i></a>
      <button class="btn btn-block" id="share-btn" type="button"><i data-icon="share-2"></i> Share my score</button>
    </div>
  </main>

  <script type="module" src="js/score.js"></script>
</body>
</html>
