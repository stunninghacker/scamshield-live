<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Incoming video call — ScamShield Live</title>
  <meta name="theme-color" content="#0b0d14">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-step="8">
  <header id="topbar"></header>

  <main class="page">
    <div class="page-head">
      <p class="meta">Final challenge</p>
      <h1>An unknown number is video calling you</h1>
    </div>

    <section class="call" aria-label="Video call chat">
      <div class="call-head">
        <div class="app-avatar"><i data-icon="user"></i></div>
        <div>
          <div class="who">CBI Officer R. Sharma</div>
          <div class="sub"><i data-icon="video"></i> <span id="call-time">00:00</span></div>
        </div>
        <span class="call-rec"><span class="rec-dot"></span> Recording</span>
      </div>
      <div class="chat" id="chat" aria-live="polite"></div>
    </section>

    <div class="choices" id="choices"></div>

    <div id="ending"></div>
  </main>

  <script type="module" src="js/story.js"></script>
</body>
</html>
