<!DOCTYPE html>

<body data-step="2">
  <header id="topbar"></header>

  <main class="page">
    <p class="eyebrow">Footprint Mirror</p>

      <a class="btn btn-primary btn-block btn-lg" href="confidence.html">Next →</a>
