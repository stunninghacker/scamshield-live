<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spot the scam — ScamShield Live</title>
  <meta name="theme-color" content="#0b0d14">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-step="4">
  <header id="topbar"></header>

  <main class="page" id="game">
    <div class="game-hud">
      <div class="hud-round" id="hud-round">Round 1 of 8</div>
      <button class="timer" id="timer" type="button" aria-label="Time left">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <circle class="ring-bg" cx="24" cy="24" r="21" fill="none" stroke-width="3"></circle>
          <circle class="ring-fg" id="ring" cx="24" cy="24" r="21" fill="none" stroke-width="3"
                  stroke-linecap="round" stroke-dasharray="131.95" stroke-dashoffset="0"></circle>
        </svg>
        <span class="timer-num" id="timer-num">15</span>
      </button>
      <div class="hud-score" id="hud-score">Score 0</div>
    </div>

    <p class="game-prompt" id="prompt">Scam or legit? You have 15 seconds.</p>

    <!-- The message is drawn here by js/game.js -->
    <div id="stage"></div>

    <div class="answer-row" id="answers">
      <button class="btn btn-scam" id="btn-scam" type="button"><i data-icon="triangle-alert"></i> Scam</button>
      <button class="btn btn-legit" id="btn-legit" type="button"><i data-icon="circle-check"></i> Legit</button>
    </div>

    <div id="feedback" aria-live="assertive"></div>

    <div class="round-track" id="track" aria-hidden="true"></div>

    <div id="skip-box" class="hidden center" style="margin-top:16px">
      <a class="btn btn-quiet" href="story.html">Skip to the story <i data-icon="arrow-right"></i></a>
    </div>
  </main>

  <script type="module" src="js/game.js"></script>
</body>
</html>
