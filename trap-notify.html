<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player card — ScamShield Live</title>
  <meta name="theme-color" content="#0b0d14">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<!-- Permission trap 3 of 3 (notifications), then the reveal of all
     three. The permission box below is plain HTML: we never ask the
     browser for real notification permission. -->
<body data-step="6" data-trap="notify">
  <header id="topbar"></header>

  <main class="page" id="main">
    <div id="setup">
      <div class="setup-steps" aria-hidden="true"><span class="done"></span><span class="done"></span><span class="now"></span></div>
      <div class="page-head">
        <p class="meta">Player card · 3 of 3</p>
        <h1>Get your result when the batch report is ready</h1>
        <p class="lead">We'll send one notification when enough of your batch has played.</p>
      </div>

      <div class="notif-preview" aria-label="Example notification">
        <div class="app-avatar"><i data-icon="shield-check"></i></div>
        <div>
          <div class="t1">ScamShield Live · when it's ready</div>
          <div class="t2">Batch report is ready. See how you compare with your class</div>
        </div>
      </div>

      <div id="actions" class="stack next-row">
        <button id="primary-btn" class="btn btn-primary btn-block" type="button"><i data-icon="bell"></i> Turn on notifications</button>
        <button id="skip-btn" class="btn btn-quiet btn-block" type="button">Not now</button>
      </div>
    </div>

    <!-- The reveal of all three permissions (filled in by js/traps.js) -->
    <section id="reveal" class="stack-lg hidden" aria-live="polite"></section>
  </main>

  <!-- Fake browser permission prompt (HTML only) -->
  <div id="perm" class="perm-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="perm-site">
    <div class="perm-box">
      <div class="perm-site" id="perm-site">this site</div>
      <div class="perm-title"><i data-icon="bell"></i><span>wants to show notifications</span></div>
      <div class="perm-actions">
        <button id="perm-block" type="button">Block</button>
        <button id="perm-allow" class="perm-allow" type="button">Allow</button>
      </div>
    </div>
  </div>

  <div id="notif-stack" class="notif-stack" aria-live="polite"></div>

  <script type="module" src="js/traps.js"></script>
</body>
</html>
