<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check a message — ScamShield Live</title>
  <meta name="description" content="Paste any suspicious message or link. ScamShield marks every red flag and explains it, entirely on your device.">
  <meta name="theme-color" content="#0b0d14">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-step="11">
  <header id="topbar"></header>

  <main class="page">
    <div class="page-head">
      <p class="meta">ScamShield checker</p>
      <h1>Is this message a scam?</h1>
      <p class="lead">Paste an SMS, WhatsApp message, email or link. Every red flag gets marked and explained.</p>
    </div>

    <label for="msg" class="sr-only">Message to check</label>
    <textarea id="msg" class="check-input" placeholder="Paste a message or link" spellcheck="false"></textarea>

    <div class="btn-row" style="margin-top:12px">
      <button id="check-btn" class="btn btn-primary" type="button"><i data-icon="search"></i> Check</button>
      <button id="sample-btn" class="btn" type="button">Try a sample</button>
    </div>
    <p class="privacy-line" style="margin-top:12px"><i data-icon="lock"></i> Runs entirely on your device. Nothing is uploaded.</p>

    <!-- Results, built by js/check.js -->
    <section id="result" class="stack hidden" style="margin-top:32px" aria-live="polite">
      <div id="verdict" class="verdict"></div>

      <div class="card">
        <h3>The message, marked</h3>
        <div id="evidence" class="evidence-text"></div>
        <p id="sig-tip" class="sig-tip"></p>
      </div>

      <div class="card">
        <h3>Why</h3>
        <ul id="why" class="why-list"></ul>
      </div>

      <div class="card">
        <h3>What to do</h3>
        <ol class="steps-list" id="todo"></ol>
      </div>
    </section>

    <div class="next-row">
      <a class="btn btn-block" href="safe.html">How to stay safe <i data-icon="arrow-right"></i></a>
    </div>
  </main>

  <script type="module" src="js/check.js"></script>
</body>
</html>
